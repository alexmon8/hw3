<!DOCTYPE html>
<!--
  COMP 4610 GUI I - HW3: Dynamic Multiplication Table
  Author: Alexi Montesinos
  Email: alexi_montesinos@student.uml.edu
  Description: Web app that generates a dynamic multiplication
               table based on user-specified column and row ranges.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Multiplication Table</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Dynamic Multiplication Table</h1>
  </header>

  <main>
    <section class="form-section">
      <fieldset>
        <legend>Please enter the table ranges</legend>

        <div class="form-group">
          <label for="minCol">Minimum Column Value</label>
          <input type="number" id="minCol" placeholder="-50 to 50">
        </div>

        <div class="form-group">
          <label for="maxCol">Maximum Column Value</label>
          <input type="number" id="maxCol" placeholder="-50 to 50">
        </div>

        <div class="form-group">
          <label for="minRow">Minimum Row Value</label>
          <input type="number" id="minRow" placeholder="-50 to 50">
        </div>

        <div class="form-group">
          <label for="maxRow">Maximum Row Value</label>
          <input type="number" id="maxRow" placeholder="-50 to 50">
        </div>

        <button type="button" id="generateBtn">Generate Table</button>
      </fieldset>
    </section>

    <div id="error-container" class="error-container" aria-live="polite"></div>

    <section id="table-section" class="table-section hidden">
      <div id="table-container" class="table-container"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
